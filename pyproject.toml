[project]
name = "quality-platform"
version = "0.1.0"
description = "Agentic Software Testing Lifecycle Workflow — multi-agent LangGraph + CLI"
readme = "README.md"
authors = [
    { name = "Rafly Rafsanjani", email = "mrrafsanjani@pgi.local" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "filelock>=4.2.10",
    "langchain-anthropic>=1.7.10",
    "langchain-google-genai>=4.4.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.8",
    "typer>=0.29.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "mypy>=1.18.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-PyYAML>=6.0.12",
    "pytest-asyncio>=1.4.1.post1",
]

[project.scripts]
qa-orchestrator = "quality_platform:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = ".caches/ruff"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
cache_dir = ".caches/mypy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
cache_dir = ".caches/pytest"
filterwarnings = [
    # Domain models are legitimately named Test* (TestCase, TestPlan, ...).
    "ignore::pytest.PytestCollectionWarning",
]
