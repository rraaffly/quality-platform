[project]
name = "quality-platform"
version = "0.1.0"
description = "Local Web platform for the agentic software testing lifecycle"
readme = "README.md"
authors = [
    { name = "Rafly Rafsanjani", email = "mrrafsanjani@pgi.local" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.5",
    "filelock>=4.2.10",
    "langchain-anthropic>=1.7.10",
    "langchain-google-genai>=4.4.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "markdown-it-py>=4.2.0",
    "psutil>=7.2.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.8",
    "typer>=0.29.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "mypy>=1.18.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-PyYAML>=6.0.12",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.28.1",
    "types-psutil>=7.2.2.20261111",
]

[project.scripts]
quality-platform = "quality_platform.web.launcher:main"
qa-web = "quality_platform.web.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["__pycache__", "*.pyc", ".env", ".env.*", "real_world", "reports"]
# The explicit target allowlists include the gitignored frontend build, but exclusions
# must still apply (unlike Hatch's `artifacts` or `force-include` overrides).
ignore-vcs = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_platform"]
only-include = [
    "src/quality_platform", "web/dist", "benchmarks/configs", "benchmarks/rubrics",
    "benchmarks/ground_truth", "benchmarks/datasets/synthetic",
]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"web/dist" = "quality_platform/_data/web/dist"
"benchmarks" = "quality_platform/_data/benchmarks"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/docs", "/pyproject.toml", "/uv.lock",
    "/README.md", "/config.yaml", "/hatch_build.py", "/web/dist",
    "/benchmarks/configs", "/benchmarks/rubrics", "/benchmarks/ground_truth/*.json",
    "/benchmarks/datasets/synthetic",
]

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = ".caches/ruff"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
cache_dir = ".caches/mypy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
cache_dir = ".caches/pytest"
filterwarnings = [
    # Domain models are legitimately named Test* (TestCase, TestPlan, ...).
    "ignore::pytest.PytestCollectionWarning",
]
