name: Cross-platform launcher smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  release-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        shell: bash
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build
      - name: Build release archive
        run: uv run --no-dev --python 3.12 python scripts/package_release.py dist/quality-platform.zip
      - name: Install and run release from a path with spaces
        run: uv run --no-dev --python 3.12 python scripts/smoke_release.py dist/quality-platform.zip
