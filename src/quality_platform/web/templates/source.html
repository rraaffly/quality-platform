{% extends "base.html" %}
{% block content %}
    <a class="breadcrumb"
       href="/projects/{{ project }}/workflows/{{ workflow }}#requirements">{{ workflow }} / Evidence</a>
    <div class="page-heading">
        <div>
            <p class="eyebrow">IMMUTABLE SNAPSHOT</p>
            <h1>Evidence sumber</h1>
            <p class="small mono muted">{{ identity }}</p>
        </div>
    </div>
    <section class="panel source-content">
        {% for line in source.splitlines() %}
            <div class="source-line" id="line-{{ loop.index }}">
                <a class="line-number" href="#line-{{ loop.index }}">{{ loop.index }}</a><code>{{ line or ' ' }}</code>
            </div>
        {% endfor %}
    </section>
{% endblock %}
